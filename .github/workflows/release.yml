name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    # Pinned to the oldest supported GitHub runner: the glibc the binary is
    # linked against sets the floor for every user (building on ubuntu-latest
    # produced binaries requiring glibc 2.39, which fail to start on
    # Ubuntu 22.04 / Debian 12). This build requires glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}. Bump Cargo.toml before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian package
        run: cargo deb

      - name: Build RPM package
        run: cargo generate-rpm

      - name: Collect artifacts and generate checksums
        run: |
          mkdir -p dist/rgm artifacts
          cp target/release/rgm LICENSE-MIT LICENSE-APACHE README.md dist/rgm/
          tar -czf artifacts/rgm-linux-x86_64.tar.gz -C dist rgm
          cp target/debian/*.deb target/generate-rpm/*.rpm artifacts/
          cd artifacts && sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: RGM ${{ github.ref_name }}
          body_path: .github/release-template.md
          generate_release_notes: true
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
